# Lean CI for a polyglot repo (.NET 10 server + Vite web).
# Runner facts (checked 2026-10-14): self-hosted, privileged=false (no Docker-in-Docker),
# default image python:3.12-slim, so every job sets image: explicitly.
# Sized for the smallest runner slot (1.5 CPU / 1.5 GB) until the project's runner is confirmed.

workflow:
  rules:
    # One pipeline per push: MR pipelines win over branch pipelines when an MR is open.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

variables:
  HUSKY: "0"
  GIT_DEPTH: "20"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  ARTIFACT_COMPRESSION_LEVEL: fast
  NODE_OPTIONS: --max-old-space-size=1024
  DOTNET_GCHeapHardLimit: "0x40000000" # 1 GB
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  npm_config_cache: $CI_PROJECT_DIR/.npm

default:
  timeout: 15m
  interruptible: true

stages: [install, check, build, test, deploy]

# ---------- rule templates ----------
# main always runs everything; branches and MRs run a stack's jobs only when that stack changed.
.web-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths: [web/**/*, config/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/main

.server-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths: [server/**/*, config/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/main

.eval-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [eval/**/*.py]
    - changes:
        paths: [eval/**/*]
        compare_to: refs/heads/main

# ---------- secrets ----------
# Guardrail (docs/GUARDRAILS.md, Secrets): a secret scanner on every pipeline, over the full history.
secrets:gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.30.1 # MIT; pinned release
    entrypoint: ['']
  needs: []
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks git --redact --no-banner --verbose .

# ---------- web ----------
.web:
  extends: .web-rules
  image: node:22.22-slim
  before_script:
    - cd web

web:install:
  extends: .web
  stage: install
  script:
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  artifacts:
    # node_modules is ~200 MB; passing it once beats four cold installs on a shared runner.
    paths: [web/node_modules/]
    expire_in: 1 hour

web:lint:
  extends: .web
  stage: check
  needs: [web:install]
  script:
    - npm run lint
    - npm run format:check

web:typecheck:
  extends: .web
  stage: check
  needs: [web:install]
  script:
    - npm run typecheck

web:test:
  extends: .web
  stage: test
  needs: [web:install]
  script:
    - npx vitest run --maxWorkers=1 --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
  artifacts:
    when: always
    reports:
      junit: web/vitest-junit.xml
    expire_in: 1 week

web:build:
  extends: .web
  stage: build
  needs: [web:install]
  script:
    - npx vite build
    # Guardrail (docs/GUARDRAILS.md, Keys and transport): no provider key or key name may ship in the bundle.
    - sh ../scripts/check-bundle-secrets.sh dist
  artifacts:
    paths: [web/dist/]
    expire_in: 1 day

# ---------- server ----------
.server:
  extends: .server-rules
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key:
      files: [server/Interpreter.Api/packages.lock.json, server/Interpreter.Tests/packages.lock.json]
    paths: [.nuget/packages/]

server:format:
  extends: .server
  stage: check
  needs: []
  script:
    - dotnet restore server --locked-mode
    - dotnet format server --verify-no-changes --no-restore

server:build:
  extends: .server
  stage: build
  needs: []
  script:
    - dotnet restore server --locked-mode
    - dotnet build server -c Release -m:1 --no-restore
  artifacts:
    paths:
      - server/*/bin/
      - server/*/obj/
    expire_in: 1 hour

server:test:
  extends: .server
  stage: test
  needs: [server:build]
  script:
    # xunit.v3 on Microsoft.Testing.Platform (opted in by global.json); the JUnit report is built into xunit.v3.
    - dotnet test --solution server/Interpreter.slnx -c Release --no-build --filter-not-trait "Category=Live" --report-xunit-junit --report-xunit-junit-filename server-junit.xml --results-directory "$CI_PROJECT_DIR/test-results"
  artifacts:
    when: always
    reports:
      junit: test-results/server-junit.xml
    expire_in: 1 week

# ---------- eval (Python, offline scripts) ----------
eval:lint:
  extends: .eval-rules
  image: python:3.12-slim
  stage: check
  needs: []
  script:
    - pip install --quiet ruff==0.17.0
    - ruff check eval

eval:test:
  extends: .eval-rules
  image: python:3.12-slim
  stage: check
  needs: []
  script:
    - pip install --quiet -r eval/requirements.txt
    - python3 -m unittest discover -s eval -p 'test_*.py'

# ---------- e2e (T3.6): manual, real provider calls ----------
# Never automatic: each run makes billed calls with keys from masked CI variables (OPENAI_API_KEY,
# DEMO_ACCESS_TOKEN, plus the cascade vendors'). Cascade runs use OpenAI STT (Cascade__Stt=openai):
# Deepgram timing numbers are not recorded (docs/GUARDRAILS.md). The soak also needs replay clips:
# REPLAY_DIR points at a folder the job can read (clips are never committed, eval/replay/README.md);
# without it the job synthesizes the labelled synthetic set. Run with SOAK_MODE=translate, realtime or cascade.
# The runner has no tags yet, so these run untagged; they want more than the smallest slot.
.e2e:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  stage: test
  needs: []
  timeout: 20m
  interruptible: false
  variables:
    Cascade__Stt: openai
    DOTNET_ROOT: /opt/dotnet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /opt/dotnet
    - export PATH=/opt/dotnet:$PATH
    - cd web && npm ci --no-audit --no-fund
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/test-results/soak/
      - web/test-results/e2e-report/

e2e:switch:
  extends: .e2e
  script:
    - npx playwright test e2e/mode-switch.spec.ts

e2e:soak:
  extends: .e2e
  timeout: 30m
  # A failed 5-minute run's trace is over the artifact size limit, which hid the report (2026-10-14).
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/test-results/soak/
  script:
    # Without REPLAY_DIR the job makes the labelled synthetic clips itself (stdlib Python, OpenAI speech).
    # SOAK_SET=adversarial voices the red-team suite instead (synthetic, for testing; G18).
    - if [ "$SOAK_SET" = adversarial ]; then (command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)) && python3 ../eval/replay/synth.py --scripts ../eval/adversarial/suite.jsonl --out ../eval/adversarial/synthetic && export REPLAY_DIR=../eval/adversarial/synthetic; fi
    - if [ -z "$REPLAY_DIR" ]; then (command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)) && python3 ../eval/replay/synth.py && export REPLAY_DIR=../eval/replay/synthetic; fi
    - SOAK=1 SOAK_MODE=${SOAK_MODE:-cascade} npx playwright test e2e/soak.spec.ts

# ---------- deploy (T5): manual, main only ----------
# Public demo, ECS on one free-tier EC2 instance behind CloudFront (infra/demo.yml, G14). Needs masked
# CI variables AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION and CLAUDE_TRANSLATOR_API_KEY,
# plus the existing OPENAI_API_KEY, ELEVENLABS_API_KEY and DEMO_ACCESS_TOKEN. Rotate DEMO_ACCESS_TOKEN
# after grading and re-run, or delete the stack.
deploy:aws:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  stage: deploy
  needs: [web:build]
  interruptible: false
  resource_group: aws-demo
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq unzip python3 >/dev/null
    - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscli.zip
    - unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install >/dev/null
    - IMAGE_TAG=$CI_COMMIT_SHORT_SHA bash infra/deploy.sh
