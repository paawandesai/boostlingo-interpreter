# Lean CI for a polyglot repo (.NET 10 server + Vite web + Python eval scripts).
# Runner facts: self-hosted docker executor, privileged=false (no Docker-in-Docker, checked 2026-10-14),
# default image python:3.12-slim, so every job sets image: explicitly.
# Measured 2026-10-15 from each job's cgroup (scripts/ci/job-resources.sh): 3 CPU and 3072 MB per job.
# Runner #235 carries the `heavy` tag and also runs untagged jobs; about 3 jobs run at once.
# Workers stay at 2 (under the 3-CPU quota, on a 4-vCPU host shared with other projects).

workflow:
  rules:
    # One pipeline per push: MR pipelines win over branch pipelines when an MR is open.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  auto_cancel:
    on_new_commit: interruptible

variables:
  HUSKY: "0"
  GIT_DEPTH: "20"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  ARTIFACT_COMPRESSION_LEVEL: fast
  # Heap caps at about 75% of the 3 GB job budget; web:test divides it among its Node processes.
  NODE_OPTIONS: --max-old-space-size=2304
  # Per .NET process; dotnet build/format run up to three (CLI, MSBuild node, compiler server).
  DOTNET_GCHeapHardLimit: "0x40000000" # 1 GB
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  npm_config_cache: $CI_PROJECT_DIR/.npm
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip

default:
  timeout: 15m
  interruptible: true
  before_script:
    - !reference [.measure, before_script]

# Every job log ends with its cgroup CPU and memory budget and peak memory (the CI report's numbers).
# A trap, not after_script: after_script runs in a fresh container, which would report its own peak.
.measure:
  before_script:
    - trap 'sh "$CI_PROJECT_DIR/scripts/ci/job-resources.sh" || true' EXIT

stages: [install, check, build, test, deploy]

# ---------- rule templates ----------
# main always runs everything; branches and MRs run a stack's jobs only when that stack changed.
.web-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths: [web/**/*, config/**/*, scripts/check-bundle-secrets.sh, scripts/ci/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/main

.server-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths: [server/**/*, config/**/*, global.json, scripts/ci/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/main

.eval-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [eval/**/*.py]
    - changes:
        paths: [eval/**/*, scripts/ci/**/*, .gitlab-ci.yml]
        compare_to: refs/heads/main

# ---------- secrets ----------
# Guardrail (docs/GUARDRAILS.md, Secrets): a secret scanner on every pipeline, over the full history.
secrets:gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.30.1 # MIT; pinned release
    entrypoint: ['']
  needs: []
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks git --redact --no-banner --verbose .

# ---------- web ----------
.web:
  extends: .web-rules
  image: node:22.22-slim
  before_script:
    - !reference [.measure, before_script]
    - cd web

web:install:
  extends: .web
  stage: install
  script:
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  artifacts:
    # node_modules is ~200 MB; passing it once beats four cold installs on a shared runner.
    paths: [web/node_modules/]
    expire_in: 1 hour

# Lint, format and typecheck share one job: each is 3-9 s of work, and a separate job costs about
# 6 s of start-up plus a 2-3 s node_modules download and another wait for a runner slot.
web:lint:
  extends: .web
  stage: check
  needs: [web:install]
  script:
    - npm run lint
    - npm run format:check
    - npm run typecheck

web:test:
  extends: .web
  stage: test
  needs: [web:install]
  variables:
    # Main process plus two workers share the 75% heap budget.
    NODE_OPTIONS: --max-old-space-size=768
  script:
    # Two workers: 18 s instead of 33 s locally (jsdom start-up is 95% of the run).
    - npx vitest run --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml
  artifacts:
    when: always
    reports:
      junit: web/vitest-junit.xml
    expire_in: 1 week

web:build:
  extends: .web
  stage: build
  needs: [web:install]
  script:
    - npx vite build
    # Guardrail (docs/GUARDRAILS.md, Keys and transport): no provider key or key name may ship in the bundle.
    - sh ../scripts/check-bundle-secrets.sh dist
  artifacts:
    paths: [web/dist/]
    expire_in: 1 day

# ---------- server ----------
.server:
  extends: .server-rules
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key:
      files: [server/Interpreter.Api/packages.lock.json, server/Interpreter.Tests/packages.lock.json]
    paths: [.nuget/packages/]
    policy: pull

# Each server job restores from the lockfile-keyed cache (about 2 s warm) instead of passing an 82 MB
# package folder as an artifact; only server:build writes the cache back.
server:format:
  extends: .server
  stage: check
  needs: []
  script:
    - dotnet restore server --locked-mode
    - dotnet format server --verify-no-changes --no-restore

server:build:
  extends: .server
  stage: build
  needs: []
  cache:
    key:
      files: [server/Interpreter.Api/packages.lock.json, server/Interpreter.Tests/packages.lock.json]
    paths: [.nuget/packages/]
    policy: pull-push
  script:
    - dotnet restore server --locked-mode
    - dotnet build server -c Release -m:1 --no-restore
  artifacts:
    paths:
      - server/*/bin/
      - server/*/obj/
    expire_in: 1 hour

server:test:
  extends: .server
  stage: test
  needs: [server:build]
  script:
    # xunit.v3 on Microsoft.Testing.Platform (opted in by global.json); the JUnit report is built into xunit.v3.
    - dotnet test --solution server/Interpreter.slnx -c Release --no-build --filter-not-trait "Category=Live" --report-xunit-junit --report-xunit-junit-filename server-junit.xml --results-directory "$CI_PROJECT_DIR/test-results"
  artifacts:
    when: always
    reports:
      junit: test-results/server-junit.xml
    expire_in: 1 week

# ---------- eval (Python, offline scripts) ----------
# One job for ruff and the unit tests: the work is about 1 s; the pip install dominates, so it is
# paid once, from a cache keyed on the pinned requirements.
eval:check:
  extends: .eval-rules
  image: python:3.12-slim
  stage: check
  needs: []
  cache:
    key:
      files: [eval/requirements.txt]
    paths: [.pip/]
  script:
    - pip install --quiet ruff==0.17.0 -r eval/requirements.txt
    - ruff check eval
    - python3 -m unittest discover -s eval -p 'test_*.py'

# ---------- live provider tests: heavy lane, manual or scheduled, real provider calls ----------
# Billed calls with the masked CI keys; a test whose key is not set skips (no DEEPGRAM_API_KEY in CI
# today, so the Deepgram STT test skips). Runs on schedules only when the schedule sets RUN_LIVE=1.
server:live:
  extends: .server
  stage: test
  needs: []
  tags: [heavy]
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_LIVE == "1"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - dotnet restore server --locked-mode
    - dotnet test --solution server/Interpreter.slnx -c Release --filter-trait "Category=Live"

# ---------- e2e (T3.6): manual, real provider calls ----------
# Never automatic: each run makes billed calls with keys from masked CI variables (OPENAI_API_KEY,
# plus the cascade vendors'). Against the local server (E2E_BASE_URL unset) the job makes its own random
# DEMO_ACCESS_TOKEN, so the demo's token never reaches a failure trace or report; with E2E_BASE_URL set
# the CI variable is used and playwright.config.ts records no trace. Artifacts are developer-only. Cascade runs use OpenAI STT (Cascade__Stt=openai):
# Deepgram timing numbers are not recorded (docs/GUARDRAILS.md). The soak also needs replay clips:
# REPLAY_DIR points at a folder the job can read (clips are never committed, eval/replay/README.md);
# without it the job synthesizes the labelled synthetic set. Run with SOAK_MODE=translate, realtime or cascade.
# Heavy lane (runner tag `heavy`). On a schedule they run only when it sets RUN_E2E=1 (they spend credit).
.e2e:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  stage: test
  needs: []
  tags: [heavy]
  timeout: 20m
  interruptible: false
  variables:
    Cascade__Stt: openai
    DOTNET_ROOT: /opt/dotnet
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_E2E == "1"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - !reference [.measure, before_script]
    # dotnet-install.sh is fetched over TLS from Microsoft, which publishes no hash for the script
    # itself, so only the channel is pinned: 10.0 resolves to that channel's latest SDK at run time.
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /opt/dotnet
    - export PATH=/opt/dotnet:$PATH
    # A per-job token for the local server (Playwright starts it with this environment): the CI
    # variable also gates the public demo, and helpers.ts types the token into the page.
    - if [ -z "$E2E_BASE_URL" ]; then export DEMO_ACCESS_TOKEN=$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n'); fi
    - cd web && npm ci --no-audit --no-fund
  artifacts:
    when: always
    expire_in: 7 days
    access: developer
    paths:
      - web/test-results/soak/
      - web/test-results/e2e-report/

e2e:switch:
  extends: .e2e
  script:
    - npx playwright test e2e/mode-switch.spec.ts

e2e:soak:
  extends: .e2e
  timeout: 30m
  # A failed 5-minute run's trace is over the artifact size limit, which hid the report (2026-10-14).
  artifacts:
    when: always
    expire_in: 7 days
    access: developer
    paths:
      - web/test-results/soak/
  script:
    # Without REPLAY_DIR the job makes the labelled synthetic clips itself (stdlib Python, OpenAI speech).
    # SOAK_SET=adversarial voices the red-team suite instead (synthetic, for testing; G18).
    - if [ "$SOAK_SET" = adversarial ]; then (command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)) && python3 ../eval/replay/synth.py --scripts ../eval/adversarial/suite.jsonl --out ../eval/adversarial/synthetic && export REPLAY_DIR=../eval/adversarial/synthetic; fi
    - if [ -z "$REPLAY_DIR" ]; then (command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)) && python3 ../eval/replay/synth.py && export REPLAY_DIR=../eval/replay/synthetic; fi
    - SOAK=1 SOAK_MODE=${SOAK_MODE:-cascade} npx playwright test e2e/soak.spec.ts

# ---------- deploy (T5): manual, main only ----------
# Public demo, ECS on one free-tier EC2 instance behind CloudFront (infra/demo.yml, G14). Needs masked
# CI variables AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION and CLAUDE_TRANSLATOR_API_KEY,
# plus the existing OPENAI_API_KEY, ELEVENLABS_API_KEY and DEMO_ACCESS_TOKEN. Rotate DEMO_ACCESS_TOKEN
# after grading and re-run, or delete the stack.
deploy:aws:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  stage: deploy
  needs: [web:build]
  interruptible: false
  resource_group: aws-demo
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    # AWS CLI v2 pinned to one release and checked against the SHA-256 of that zip. Hash computed on
    # 2026-10-16 from https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.38.1.zip (74,129,231
    # bytes). Bump the version and the hash together.
    AWSCLI_VERSION: "2.38.1"
    AWSCLI_SHA256: "b11ed416d91f4251da363a17706938eeaf0e520745754c104c0c1890dd8363c7"
  script:
    - apt-get update -qq && apt-get install -y -qq unzip python3 >/dev/null
    - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" -o /tmp/awscli.zip
    - echo "${AWSCLI_SHA256}  /tmp/awscli.zip" | sha256sum -c -
    - unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install >/dev/null
    - IMAGE_TAG=$CI_COMMIT_SHORT_SHA bash infra/deploy.sh
